[project]
name = "bank-master-creator"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "S", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
