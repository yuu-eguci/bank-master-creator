[project]
name = "bank-master-creator"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "S", "SIM", "PTH", "DTZ", "PT", "PL", "RUF"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
# write_sql はデータ 3 つ + 日時 + キーワード専用のオプション 3 つです。
max-args = 7

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "DTZ001"]

[tool.mypy]
files = ["bank_master_creator.py", "tests"]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
# テストは引数の型注釈を省略します。
module = "test_bank_master_creator"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
